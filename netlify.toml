[build]
  publish = "dist/public"
  command = "npm run build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Proxy /api/contact to the Netlify serverless function
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
  force = true

# Proxy /api/ai-chat to the Netlify serverless function
[[redirects]]
  from = "/api/ai-chat"
  to = "/.netlify/functions/ai-chat"
  status = 200
  force = true

# Proxy /api/admin-novedades to the Netlify serverless function
[[redirects]]
  from = "/api/admin-novedades"
  to = "/.netlify/functions/admin-novedades"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin-novedades/*"
  to = "/.netlify/functions/admin-novedades"
  status = 200
  force = true

# Redirección canónica 301
[[redirects]]
  from = "/politica-de-privacidad"
  to = "/privacidad"
  status = 301
  force = true

# SPA fallback para rutas de la aplicación
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
